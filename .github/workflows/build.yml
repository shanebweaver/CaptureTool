name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build combined Store package
      run: |
        $project = "src\CaptureTool.Presentation.Windows.WinUI\CaptureTool.Presentation.Windows.WinUI.csproj"
        $solutionDir = "${{ github.workspace }}\"
        msbuild $project `
          /restore `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:SolutionDir="$solutionDir" `
          /p:GenerateAppxPackageOnBuild=true `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x64|arm64" `
          /p:AppxPackageDir="${solutionDir}output\" `
          /p:GenerateTemporaryStoreCertificate=false
      shell: pwsh

    - name: Verify packaged UI languages
      shell: pwsh
      run: |
        $bundles = @(Get-ChildItem output -Recurse -Filter *.msixbundle)
        if (!$bundles.Count) { throw 'No Store bundle was produced.' }
        foreach ($bundle in $bundles) {
          .github/scripts/assert-package-localization.ps1 -BundlePath $bundle.FullName
        }

    - name: Install coverage tools
      run: |
        dotnet tool install --global dotnet-coverage
        dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Run .NET tests with coverage
      run: |
        dotnet-coverage collect "powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\run-managed-tests.ps1" -s .github\coverage.runsettings -f cobertura -o coverage.cobertura.xml

    - name: Generate coverage report
      run: |
        reportgenerator -reports:coverage.cobertura.xml -targetdir:coverage-report -reporttypes:"HtmlInline_AzurePipelines;MarkdownSummaryGithub" -title:"CaptureTool Coverage"

    - name: Enforce coverage threshold
      run: |
        [xml]$coverage = Get-Content coverage.cobertura.xml
        $lineRate = [double]$coverage.coverage.'line-rate'
        $coveragePercent = [math]::Round($lineRate * 100, 2)
        $minimumCoveragePercent = 90
        "Line coverage: $coveragePercent%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        "Minimum line coverage: $minimumCoveragePercent%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        if ($coveragePercent -lt $minimumCoveragePercent) {
          throw "Line coverage $coveragePercent% is below the required $minimumCoveragePercent%."
        }

    - name: Publish coverage summary
      run: |
        Get-Content coverage-report\SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.cobertura.xml
          coverage-report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.cobertura.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Upload Package Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: StorePackage
        if-no-files-found: error
        path: |
          output/*.msix
          output/*.msixbundle
          output/*.msixupload
          output/*.appxsym
