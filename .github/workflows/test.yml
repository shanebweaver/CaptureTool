name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Checkout CaptureKit
      uses: actions/checkout@v7
      with:
        repository: shanebweaver/CaptureKit
        ref: fix/keep-audio-route-mutable
        path: CaptureKit
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build CaptureKit packages
      run: |
        .\CaptureKit\build.ps1 -Configuration Release -SkipNativeTests -SkipManagedTests

    - name: Restore and build solution
      run: |
        dotnet build CaptureTool.slnx --configuration Release -p:Platform=x64

    - name: Build packaged Capture Analysis provider smoke bundle
      run: |
        $project = "src\CaptureTool.Presentation.Windows.WinUI\CaptureTool.Presentation.Windows.WinUI.csproj"
        $solutionDir = "${{ github.workspace }}\"
        msbuild $project `
          /restore `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:SolutionDir="$solutionDir" `
          /p:GenerateAppxPackageOnBuild=true `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x64|arm64" `
          /p:AppxPackageDir="${{ runner.temp }}\capture-analysis-smoke\" `
          /p:GenerateTemporaryStoreCertificate=false
      shell: pwsh

    - name: Verify packaged Capture Analysis providers
      run: |
        .\.github\scripts\verify-capture-analysis-provider-smoke.ps1 `
          -PackageRoot "${{ runner.temp }}\capture-analysis-smoke" `
          -AppBinRoot "${{ github.workspace }}\src\CaptureTool.Presentation.Windows.WinUI\bin" `
          -RunManifest "tools\CaptureTool.Analysis.Evaluation\Corpus\v1\microsoft-windows-baseline.json"
      shell: pwsh

    - name: Run Capture Analysis model release gates
      run: |
        $evaluationOutput = Join-Path "${{ runner.temp }}" "capture-analysis-evaluation"
        dotnet run `
          --project tools\CaptureTool.Analysis.Evaluation\CaptureTool.Analysis.Evaluation.csproj `
          --configuration Release `
          -p:Platform=x64 `
          -- evaluate `
          --corpus tools\CaptureTool.Analysis.Evaluation\Corpus\v1\corpus.json `
          --run tools\CaptureTool.Analysis.Evaluation\Corpus\v1\microsoft-windows-baseline.json `
          --output $evaluationOutput `
          --retention-days 7
      shell: pwsh

    - name: Install coverage tools
      run: |
        dotnet tool install --global dotnet-coverage

    - name: Run .NET tests with coverage
      run: |
        dotnet-coverage collect "powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\run-managed-tests.ps1" -s .github\coverage.runsettings -f cobertura -o coverage.cobertura.xml

    - name: Enforce coverage threshold
      run: |
        [xml]$coverage = Get-Content coverage.cobertura.xml
        $lineRate = [double]$coverage.coverage.'line-rate'
        $coveragePercent = [math]::Round($lineRate * 100, 2)
        $minimumCoveragePercent = 90
        "Line coverage: $coveragePercent%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        "Minimum line coverage: $minimumCoveragePercent%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        if ($coveragePercent -lt $minimumCoveragePercent) {
          throw "Line coverage $coveragePercent% is below the required $minimumCoveragePercent%."
        }
